<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LIV8 - Elevate Your Life, Wealth, Health & Business</title>
    <meta name="description" content="Consulting. Funding. Health. Solar. AI. All in One Ecosystem. Transform every aspect of your success with our comprehensive suite of services." />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- PushLap Affiliate Tracking -->
    <script
      src="https://pushlapgrowth.com/affiliate-tracker.js"
      data-affiliate data-program-id="9acd7ded-50dc-4b98-b698-c78edc0481b3"
      async>
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
    <!-- Chat Widget Integration -->
    <script>
      (function(d, s, id){
        var js, fjs = d.getElementsByTagName(s)[0];
        if (d.getElementById(id)) return;
        js = d.createElement(s); js.id = id;
        js.src = 'https://api.anychat.one/widget/76e7545e-1b03-49da-a970-f19929f1e45c?r=' + encodeURIComponent(window.location);
        fjs.parentNode.insertBefore(js, fjs);
      }(document, 'script', 'contactus-jssdk'));
    </script>
    
    <!-- PushLap Form Tracking -->
    <script>
      (function () {
        function findEmailAndName(form) {
          const emailInput = form.querySelector('input[type="email"], input[name*="email" i]');
          const nameInput = form.querySelector('input[name*="name" i]');

          const email = emailInput ? emailInput.value.trim() : null;
          const name = nameInput ? nameInput.value.trim() : null;

          return { email, name };
        }

        function handleFormSubmit(event) {
          const form = event.target;
          const { email, name } = findEmailAndName(form);

          if (email && typeof createPushLapEmail === "function") {
            window.createPushLapEmail(email, name || undefined);
          }
        }

        function attachListeners() {
          const forms = document.querySelectorAll('form');

          forms.forEach((form) => {
            if (!form.dataset.pushlapBound) {
              form.addEventListener('submit', handleFormSubmit);
              form.dataset.pushlapBound = 'true';
            }
          });
        }

        attachListeners();

        const observer = new MutationObserver(() => attachListeners());
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
